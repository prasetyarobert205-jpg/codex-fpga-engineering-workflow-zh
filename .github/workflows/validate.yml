name: 中文 FPGA 工作流验证

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: 验证角色、Skill、schema、故障库 canary、脚本和公开内容
        shell: pwsh
        run: ./scripts/validate-package.ps1
      - name: Smoke 测试 GitHub 地址部署入口
        shell: pwsh
        run: |
          $previewTarget = Join-Path $env:RUNNER_TEMP 'fpga-bootstrap-preview'
          New-Item -ItemType Directory -Path $previewTarget -Force | Out-Null
          $preview = ./scripts/bootstrap.ps1 -Scope Project -ProjectPath $previewTarget -WaveMode Skip -WhatIf
          if ($preview.status -ne 'PLAN_NO_CHANGES') { throw 'bootstrap WhatIf 未返回 PLAN_NO_CHANGES。' }
          if (Test-Path (Join-Path $previewTarget '.codex/agents')) { throw 'bootstrap WhatIf 发生了写入。' }

          $installTarget = Join-Path $env:RUNNER_TEMP 'fpga-bootstrap-install'
          New-Item -ItemType Directory -Path $installTarget -Force | Out-Null
          $result = ./scripts/bootstrap.ps1 -Scope Project -ProjectPath $installTarget -WaveMode Skip
          if ($result.status -ne 'READY' -or $result.roles.found -ne 13 -or -not $result.skills.setup_fpga_workflow) { throw 'bootstrap 安装结果不正确。' }
          $doctor = ./scripts/deployment-doctor.ps1 -Scope Project -ProjectPath $installTarget -SkipWaveProbe
          if ($doctor.status -ne 'READY') { throw 'deployment doctor 失败。' }
          ./scripts/uninstall.ps1 -Scope Project -ProjectPath $installTarget
          if (Test-Path (Join-Path $installTarget '.codex/codex-fpga-engineering-workflow-zh.install.json')) { throw '卸载后仍保留 install manifest。' }

          $wave = ./scripts/prepare-wave-environment.ps1 -Mode Detect
          if ($wave.status -eq 'DETECTING') { throw 'wave Detect 没有收敛到明确状态。' }
      - name: 验证 wave-mcp 可选集成的 Python 与脱敏清单
        shell: pwsh
        run: |
          python -m py_compile integrations/wave-mcp/query_adapter.py integrations/wave-mcp/validate_environment.py integrations/wave-mcp/test_query_adapter.py
          python integrations/wave-mcp/validate_environment.py integrations/wave-mcp/environment.example.json --allow-placeholders
          python integrations/wave-mcp/validate_environment.py integrations/wave-mcp/tested-environment.json
          python integrations/wave-mcp/query_adapter.py --help
          Push-Location integrations/wave-mcp
          try { python -m unittest -v test_query_adapter.py } finally { Pop-Location }
      - name: Smoke 测试标准工程脚手架
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'fpga-scaffold-fixture'
          ./scripts/new-fpga-project.ps1 -Destination $fixture -ProjectName fixture -TopModule top -Vendor XILINX
          [IO.File]::WriteAllText((Join-Path $fixture 'project/par/fixture.xpr'), 'fixture')
          [IO.File]::WriteAllText((Join-Path $fixture 'project/rtl/top.sv'), 'module top(input logic clk); endmodule')
          $detection = ./scripts/detect-vendor.ps1 -ProjectRoot $fixture
          $lists = ./scripts/update-filelists.ps1 -ProjectRoot $fixture -Vendor XILINX
          if ($detection.status -ne 'DETECTED' -or $detection.vendor -ne 'XILINX') { throw '厂商识别 smoke 失败。' }
          if ($lists.product_source_count -ne 1) { throw 'Filelist smoke 失败。' }
          $projectScript = Join-Path $fixture 'project/script'
          foreach ($requiredEntry in @('run.bat', 'setting.bat', 'src_list.txt')) {
            if (-not (Test-Path (Join-Path $projectScript $requiredEntry))) { throw "缺少正式 build 入口：$requiredEntry" }
          }
          if (@(Get-ChildItem $projectScript -Filter 'build_*.ps1').Count -ne 0) { throw '生成了废弃 PowerShell build adapter。' }
      - name: Smoke 测试项目级安装与哈希核对
        shell: pwsh
        run: |
          $installTarget = Join-Path $env:RUNNER_TEMP 'fpga-workflow-install-fixture'
          New-Item -ItemType Directory -Path $installTarget -Force | Out-Null
          ./scripts/install.ps1 -Scope Project -ProjectPath $installTarget
          ./scripts/verify-install.ps1 -Scope Project -ProjectPath $installTarget
