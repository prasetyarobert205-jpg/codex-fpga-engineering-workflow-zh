<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Codex FPGA 中文证据工程工作流</title>
  <desc id="desc">从工程事实、单一产品写入、逐拍证据到独立 FPGA 签核的全中文多角色工作流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091225"/>
      <stop offset="0.55" stop-color="#10234a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1085" cy="56" r="170" fill="#4f46e5" opacity="0.12"/>
  <circle cx="102" cy="390" r="190" fill="#0284c7" opacity="0.09"/>

  <g transform="translate(72 66)">
    <rect width="118" height="26" rx="13" fill="#172f5e" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="59" y="18" text-anchor="middle" fill="#bae6fd" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">全中文开源</text>
    <text x="0" y="83" fill="#f8fafc" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="48" font-weight="750">Codex FPGA</text>
    <text x="0" y="137" fill="url(#accent)" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="46" font-weight="750">证据工程工作流</text>
    <text x="0" y="184" fill="#cbd5e1" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="19">一个产品写入者 · 多专项监督 · 独立证据签核</text>

    <g transform="translate(0 220)" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
      <rect width="116" height="34" rx="17" fill="#12284e" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text x="58" y="22" text-anchor="middle" fill="#bae6fd">13 个专用角色</text>
      <rect x="128" width="142" height="34" rx="17" fill="#17264e" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="199" y="22" text-anchor="middle" fill="#c7d2fe">单一写入门禁</text>
      <rect x="282" width="154" height="34" rx="17" fill="#211e4d" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="359" y="22" text-anchor="middle" fill="#ddd6fe">独立最终审核</text>
    </g>
  </g>

  <g transform="translate(700 65)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 45H205M100 145H205M100 245H205M310 145H380" stroke="#64748b" stroke-width="2" stroke-dasharray="5 7"/>
      <path d="M205 45V245M205 145H310" stroke="#64748b" stroke-width="2" stroke-dasharray="5 7"/>
    </g>
    <g font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" text-anchor="middle">
      <g transform="translate(0 16)">
        <rect width="100" height="58" rx="12" fill="#102f50" stroke="#38bdf8"/>
        <text x="50" y="25" fill="#e0f2fe" font-size="12" font-weight="700">架构合同</text>
        <text x="50" y="43" fill="#7dd3fc" font-size="10">事实 + 边界</text>
      </g>
      <g transform="translate(0 116)">
        <rect width="100" height="58" rx="12" fill="#172951" stroke="#818cf8"/>
        <text x="50" y="25" fill="#eef2ff" font-size="12" font-weight="700">专项监督</text>
        <text x="50" y="43" fill="#a5b4fc" font-size="10">并行只读</text>
      </g>
      <g transform="translate(0 216)">
        <rect width="100" height="58" rx="12" fill="#24204f" stroke="#a78bfa"/>
        <text x="50" y="25" fill="#f5f3ff" font-size="12" font-weight="700">工程证据</text>
        <text x="50" y="43" fill="#c4b5fd" font-size="10">报告 + 边界</text>
      </g>

      <g transform="translate(205 104)" filter="url(#glow)">
        <rect width="105" height="82" rx="15" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>
        <path d="M22 26h61v30H22zM31 18v8M47 18v8M63 18v8M79 18v8M31 56v8M47 56v8M63 56v8M79 56v8M14 34h8M14 48h8M83 34h8M83 48h8" stroke="#dbeafe" stroke-width="2"/>
        <text x="52.5" y="76" fill="#eff6ff" font-size="10" font-weight="700">唯一实现者</text>
      </g>

      <g transform="translate(380 104)">
        <rect width="105" height="82" rx="15" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
        <path d="M31 42l14 14 30-33" stroke="#c4b5fd" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52.5" y="76" fill="#eef2ff" font-size="10" font-weight="700">独立签核</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#93c5fd" stroke-opacity="0.16" stroke-width="2"/>
</svg>
